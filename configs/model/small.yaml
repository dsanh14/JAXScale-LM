# Small preset: ~29M parameters. Sized for a single GPU/TPU (trains slowly
# on CPU). Requires a trained BPE tokenizer (scripts/train_tokenizer.py).
model:
  vocab_size: 8192
  max_sequence_length: 512
  num_layers: 8
  hidden_size: 512
  intermediate_size: 2048
  num_attention_heads: 8
  num_key_value_heads: 8
  dropout_rate: 0.1
  attention_dropout_rate: 0.1
  normalization_epsilon: 1.0e-6
  parameter_dtype: float32
  compute_dtype: bfloat16
  tie_embeddings: true
  use_bias: false
  initializer_range: 0.02
  rope_theta: 10000.0

tokenizer:
  kind: bpe
  vocab_size: 8192
  path: artifacts/tokenizers/bpe_8192.json
