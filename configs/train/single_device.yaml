# Single-device training of the tiny model on TinyStories (byte-level).
# Works on CPU (slow but steady) or a single GPU/TPU.
defaults:
  - ../model/tiny.yaml

project:
  run_name: tiny_tinystories
  seed: 42

data:
  source: tinystories
  sequence_length: 256
  batch_size: 16
  validation_fraction: 0.01
  max_train_documents: 20000

optimizer:
  learning_rate: 3.0e-4
  weight_decay: 0.01
  grad_clip_norm: 1.0
  warmup_steps: 100
  schedule: cosine
  min_learning_rate_ratio: 0.1

training:
  max_steps: 2000
  gradient_accumulation_steps: 1
  log_interval: 20

evaluation:
  interval_steps: 200
  num_batches: 16

checkpoint:
  interval_steps: 200
  max_to_keep: 3
  keep_best: true
