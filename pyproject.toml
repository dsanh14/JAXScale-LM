[project]
name = "jaxscale-lm"
version = "0.1.0"
description = "A JAX/XLA training and inference systems lab: a small decoder-only Transformer LM with sharding, KV-cache inference, benchmarking, checkpointing, and serving."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Diego Sanchez" }]
dependencies = [
    "jax>=0.6",
    "flax>=0.10",
    "optax>=0.2",
    "orbax-checkpoint>=0.11",
    "numpy>=1.26",
    "datasets>=3.0",
    "tokenizers>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pyright>=1.1.380",
    "httpx>=0.27",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jaxscale_lm"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["src", "scripts"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, hermetic unit tests",
    "integration: end-to-end tests (train/checkpoint/serve)",
    "slow: tests that take more than ~30s",
    "accelerator: requires a real GPU/TPU",
    "multi_device: requires (or simulates) more than one device",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.protobuf.*",
]

[tool.coverage.run]
source = ["src/jaxscale_lm"]
